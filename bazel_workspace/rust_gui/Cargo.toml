[package]
name = "rust_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_gui_app"
path = "main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webbrowser = "1.0"
tiny_http = "0.12"
